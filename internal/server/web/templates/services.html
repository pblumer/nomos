{{define "services"}}{{template "layout" .}}{{end}}{{define "content_services"}}
<section class="page-header"><div><h2>Services</h2><p>Browse and create services in the Cosmos.</p></div></section>
<section class="split-grid"><article class="card"><h3>Create service</h3><form method="post" action="/services" class="form-grid"><label>Name<input name="name" required></label><label>Owner<input name="owner" placeholder="unknown"></label><label class="check"><input type="checkbox" name="force"> Force overwrite</label><button class="button button-primary">Create</button></form></article></section>
<section class="card"><h3>Services</h3><table class="data-table"><thead><tr><th>Name</th><th>Owner</th><th>Status</th><th>Path</th><th></th></tr></thead><tbody>{{range .Services}}<tr><td>{{.Name}}</td><td>{{.Owner}}</td><td><span class="badge">{{.Status}}</span></td><td><code>{{.Path}}</code></td><td><a class="button button-secondary" href="/services/{{.Name}}">Detail</a></td></tr>{{else}}<tr><td colspan="5" class="empty-state">No services</td></tr>{{end}}</tbody></table></section>{{end}}
