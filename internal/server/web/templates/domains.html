{{define "domains"}}{{template "layout" .}}{{end}}
{{define "content_domains"}}
<section class="page-header"><h2>Domains</h2><p>Manage and inspect domains in this Cosmos</p></section>
<section class="card"><div class="table-wrap"><table class="data-table"><thead><tr><th>Domain</th><th>Owner</th><th>Services</th><th>Status</th><th>Actions</th></tr></thead><tbody>{{range .Tree.Domains}}<tr><td><strong>{{.Name}}</strong></td><td>{{.Owner}}</td><td>{{len .Services}}</td><td><span class="badge">{{.Status}}</span></td><td><a class="button button-secondary" href="/domains/{{.Name}}">View Details</a></td></tr>{{end}}</tbody></table></div></section>
{{end}}
