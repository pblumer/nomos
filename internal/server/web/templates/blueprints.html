{{define "blueprints"}}{{template "layout" .}}{{end}}{{define "content_blueprints"}}<section class="page-header"><div><h2>Blueprints</h2><p>Product and service blueprints.</p></div><a class="button button-secondary" href="/api/v1/blueprints">API JSON</a></section><section class="card"><table class="data-table"><thead><tr><th>ID</th><th>Type</th><th>Name</th><th>Version</th><th>Status</th><th>Owner</th></tr></thead><tbody>{{range .Blueprints}}<tr><td><a href="/blueprints/{{.ID}}">{{.ID}}</a></td><td>{{.Type}}</td><td>{{.Name}}</td><td>{{.Version}}</td><td><span class="badge">{{.Status}}</span></td><td>{{.Owner}}</td></tr>{{else}}<tr><td colspan="6" class="empty-state">No blueprints</td></tr>{{end}}</tbody></table></section>{{end}}
