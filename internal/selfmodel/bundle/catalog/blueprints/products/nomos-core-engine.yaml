id: nomos-core-engine
type: product
name: Nomos Core Engine
version: "0.1.0"
status: stable
offered_by: core.nomos
owner: Nomos Core Team
summary: Das Nomos-Werkzeug selbst — versioniert als Produkt-Blueprint im eigenen Cosmos.
purpose: Nomos modelliert sich selbst als Nomos-Artefakt. Dieses Blueprint beschreibt die Kernfähigkeiten der Nomos-Engine (ADR-0014).
consumers:
  - Engineers
  - KI-Agenten (MCP)
  - Platform Teams
tags:
  - self-model
  - core
  - system
lifecycle_status: stable
processes:
  - prc-cosmos-init
  - prc-domain-add
  - prc-service-erfassen
  - prc-blueprint-validieren
  - prc-instanz-verifizieren
fulfillment:
  required_services:
    - service_ref: service-validator-engine
      role: primary
      required: true
      description: Strukturelle und referentielle Validierung aller Cosmos-Artefakte.
    - service_ref: service-rest-adapter
      role: primary
      required: true
      description: HTTP REST-API für alle Operationen.
    - service_ref: service-mcp-adapter
      role: supporting
      required: false
      description: MCP-Server für KI-Agenten-Integration.
    - service_ref: service-web-adapter
      role: supporting
      required: false
      description: Eingebettete Web-UI.
    - service_ref: service-git-repo-manager
      role: supporting
      required: true
      description: Git-basierter Workspace als Quelle der Wahrheit.
    - service_ref: service-catalog-manager
      role: supporting
      required: true
      description: Blueprint- und Instance-Katalog.
