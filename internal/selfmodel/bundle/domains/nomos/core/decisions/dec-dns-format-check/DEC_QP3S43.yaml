id: DEC_QP3S43
type: decision
name: DNS-Format-Prüfung
version: "0.1.0"
status: stable
owner: Nomos Core Team
summary: Prüft ob ein Namespace-String dem DNS-Format (RFC 1035) entspricht und als Nomos-Domain-Bezeichner geeignet ist.
inputs:
    - name: dns
      type: string
      description: Zu prüfender DNS-Namespace-String (z.B. "payments.acme.com")
outputs:
    - name: valid
      type: boolean
      description: true wenn der String ein gültiger DNS-Namespace ist
    - name: reason
      type: string
      description: Fehlerbeschreibung wenn valid=false
rules:
    - id: rule-min-length
      description: Mindestens zwei Labels, getrennt durch Punkte
      condition: "len(parts) >= 2"
      output:
        valid: false
        reason: "Namespace muss mindestens zwei Labels enthalten (z.B. service.example)"
    - id: rule-label-format
      description: Jedes Label besteht aus [a-z0-9-], beginnt und endet mit alphanumerischem Zeichen
      condition: "label !~ /^[a-z0-9]([a-z0-9-]*[a-z0-9])?$/"
      output:
        valid: false
        reason: "Label enthält ungültige Zeichen oder beginnt/endet mit Bindestrich"
    - id: rule-max-label-length
      description: Kein Label länger als 63 Zeichen
      condition: "len(label) > 63"
      output:
        valid: false
        reason: "Label überschreitet maximale Länge von 63 Zeichen"
    - id: rule-total-length
      description: Gesamtlänge maximal 253 Zeichen
      condition: "len(dns) > 253"
      output:
        valid: false
        reason: "Namespace überschreitet maximale Gesamtlänge von 253 Zeichen"
    - id: rule-valid
      description: Alle Regeln erfüllt
      condition: "default"
      output:
        valid: true
        reason: ""
used_by:
    - PRC_X5QYAW
