services:
  nomos:
    build:
      context: .
      args:
        VERSION: dev
    ports:
      - "7373:7373"
    volumes:
      - nomos-cosmos:/cosmos/data
    environment:
      COSMOS_PATH: /cosmos/data
      NOMOS_LISTEN: 0.0.0.0:7373
      # Public domain shown in the Cosmos Explorer instead of the container
      # hostname. Only honored once ownership is proven via a TXT record
      # _nomos.<domain> = "nomos-domain=<domain>"; otherwise it falls back to
      # the hostname under "local".
      NOMOS_DOMAIN: nomos.blumer.cloud
    restart: unless-stopped

volumes:
  nomos-cosmos:
