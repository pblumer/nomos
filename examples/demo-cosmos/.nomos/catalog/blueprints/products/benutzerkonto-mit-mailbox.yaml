id: PROD-ACC-MBX-001
type: product_blueprint
name: Benutzerkonto mit Mailbox
version: 0.1.0
status: draft
owner: Identity & Collaboration
offered_by: identity.blumer.cloud
owning_domain: identity.blumer.cloud
summary: >
  Bereitstellung eines Benutzerkontos mit zugehoeriger Mailbox.
variants:
  - id: VAR-ACC-MBX-INT
    name: Internes Benutzerkonto mit Mailbox
  - id: VAR-ACC-MBX-EXT
    name: Externes Benutzerkonto mit Mailbox
required_inputs:
  - person_reference
  - first_name
  - last_name
  - user_type
  - tenant_id
required_service_blueprints:
  - SB-IDENTITY-ACCOUNT-001
  - SB-MAILBOX-001
  - SB-LICENSE-ASSIGNMENT-001
required_services:
  - service_ref: identity.blumer.cloud/user-account
    service_blueprint_ref: SB-IDENTITY-ACCOUNT-001
    purpose: Erstellt und verwaltet das Benutzerkonto.
    required: true
  - service_ref: collaboration.blumer.cloud/mailbox
    service_blueprint_ref: SB-MAILBOX-001
    purpose: Erstellt und verwaltet die Mailbox.
    required: true
  - service_ref: collaboration.blumer.cloud/license-assignment
    service_blueprint_ref: SB-LICENSE-ASSIGNMENT-001
    purpose: Weist die fuer Konto und Mailbox benoetigte Lizenz zu.
    required: true
fulfillment:
  required_services:
    - service_ref: identity.blumer.cloud/user-account
      role: primary
      required: true
      description: Creates the account in the identity domain.
    - service_ref: collaboration.blumer.cloud/mailbox
      role: supporting
      required: true
      description: Provides the mailbox capability.
    - service_ref: collaboration.blumer.cloud/license-assignment
      role: supporting
      required: true
      description: Assigns the required license.
rules:
  - RULE-ACC-001
  - RULE-ACC-003
quality_criteria:
  - account_exists
  - mailbox_exists
  - tenant_matches
  - no_blocking_findings
evidence_requirements:
  - account_creation_response
  - mailbox_creation_response
  - compliance_check_result
