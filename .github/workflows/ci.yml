name: ci
on: [push, pull_request]

jobs:
  go:
    name: Go – build, vet, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25.x' }
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: go test (with coverage)
        run: go test -coverprofile=coverage.out ./...
      - name: go build
        run: go build -o nomos-ci ./cmd/nomos

  nomos-validate:
    name: Nomos – validate demo cosmos
    runs-on: ubuntu-latest
    needs: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25.x' }
      - name: Build nomos
        run: go build -o nomos-ci ./cmd/nomos
      - name: Validate demo cosmos
        run: ./nomos-ci validate --path examples/demo-cosmos --format json
