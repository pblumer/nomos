[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nomos-mcp"
version = "0.1.0"
description = "MCP Server für Nomos — ermöglicht KI-Agenten den Zugriff auf Nomos-Artefakte"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
nomos-mcp = "nomos_mcp.server:run"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
