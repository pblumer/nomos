---
- name: Build nomos binary (linux/amd64)
  delegate_to: localhost
  become: false
  shell: |
    LDFLAGS="-X github.com/nomos/nomos/internal/version.Version={{ nomos_version }} -X github.com/nomos/nomos/internal/version.Commit={{ nomos_version }} -X github.com/nomos/nomos/internal/version.Date={{ ansible_date_time.iso8601 }} -X github.com/nomos/nomos/internal/version.Dirty=false -X github.com/nomos/nomos/internal/version.BuiltBy=ansible"
    go build -ldflags "$LDFLAGS" -o /tmp/nomos-linux-amd64 ./cmd/nomos
  environment:
    GOOS: linux
    GOARCH: amd64
    CGO_ENABLED: "0"
  args:
    chdir: "{{ playbook_dir }}/../../"

- name: Ensure nomos system user exists
  user:
    name: "{{ nomos_user }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ nomos_home }}"
    create_home: true

- name: Create cosmos directory
  file:
    path: "{{ nomos_cosmos_path }}"
    state: directory
    owner: "{{ nomos_user }}"
    group: "{{ nomos_user }}"
    mode: "0755"

- name: Upload nomos binary
  copy:
    src: /tmp/nomos-linux-amd64
    dest: "{{ nomos_home }}/nomos"
    owner: "{{ nomos_user }}"
    group: "{{ nomos_user }}"
    mode: "0755"
  notify: restart nomos

# Update the Docker container binary (Traefik routes to this container)
- name: Copy binary into nomos Docker container
  command: docker cp {{ nomos_home }}/nomos nomos:/usr/local/bin/nomos
  notify: restart nomos docker

- name: Install systemd service (web server)
  template:
    src: nomos.service.j2
    dest: /etc/systemd/system/nomos.service
    mode: "0644"
  notify:
    - reload systemd
    - restart nomos

- name: Install systemd service (MCP HTTP server)
  template:
    src: nomos-mcp.service.j2
    dest: /etc/systemd/system/nomos-mcp.service
    mode: "0644"
  notify:
    - reload systemd
    - restart nomos-mcp

- name: Ensure Docker cosmos directory exists
  file:
    path: "{{ nomos_cosmos_path }}"
    state: directory
    owner: "{{ nomos_user }}"
    group: "{{ nomos_user }}"
    mode: "0755"

- name: Bootstrap cosmos if not present
  command:
    cmd: "{{ nomos_home }}/nomos cosmos init {{ nomos_cosmos_path }}"
    creates: "{{ nomos_cosmos_path }}/.nomos/cosmos.yaml"

# The Docker container runs as UID/GID 10001. Cosmos files must be owned by 10001
# so the server can write them (BPMN sync, self-upgrade, etc.).
# Host nomos user UID 998 ≠ container UID 10001 — chown from host as root.
- name: Fix cosmos ownership for Docker container (UID 10001)
  file:
    path: "{{ nomos_cosmos_path }}"
    state: directory
    owner: "10001"
    group: "10001"
    recurse: true

- name: Enable and start nomos service
  systemd:
    name: nomos
    enabled: true
    state: started
    daemon_reload: true

- name: Enable and start nomos-mcp service
  systemd:
    name: nomos-mcp
    enabled: true
    state: started
    daemon_reload: true

# Reverse proxy is handled by Traefik (Docker) on this host.
