---
- name: Add nomos.blumer.cloud to Caddyfile
  blockinfile:
    path: /etc/caddy/Caddyfile
    marker: "# {mark} nomos.blumer.cloud"
    block: |
      nomos.blumer.cloud {
        encode zstd gzip
        reverse_proxy {{ nomos_listen }}
      }
    create: false
  notify: reload caddy

- name: Ensure Caddy is running
  systemd:
    name: caddy
    state: started
    enabled: true
