---
- name: Deploy nomos Go server
  hosts: server01.blumer.cloud
  become: true

  vars:
    nomos_user: nomos
    nomos_home: /opt/nomos
    nomos_cosmos_path: /opt/nomos/data
    nomos_listen: "127.0.0.1:7373"
    nomos_mcp_listen: "127.0.0.1:7374"
    nomos_version: "{{ lookup('pipe', 'git -C ' + playbook_dir + '/../../ rev-parse --short HEAD') }}"

  roles:
    - nomos

  post_tasks:
    - name: Upgrade self-model in Docker cosmos
      command: docker exec nomos /usr/local/bin/nomos self upgrade --path /workspace
      ignore_errors: true
